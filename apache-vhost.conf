<VirtualHost *:80>
    ServerName api.rsywx.com
    ServerAlias api.rsywx.net
    DocumentRoot /home/tr/www/api.rsywx.2026/public

    <Directory /home/tr/www/api.rsywx.2026/public>
        AllowOverride All
        Require all granted
        Options -Indexes

        # Enable URL rewriting for Slim
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]
    </Directory>
</VirtualHost>
